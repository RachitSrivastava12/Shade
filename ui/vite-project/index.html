<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shade — the open dark pool on Solana</title>
<meta name="description" content="The open dark pool for Solana. Orders stay hidden until they fill." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='12' fill='%23E9B872'/%3E%3Ccircle cx='24.4' cy='15.6' r='12' fill='%2308090C'/%3E%3C/svg%3E" />
<style>
:root{
  --void:#08090c; --corona:#f0ead6; --muted:rgba(240,234,214,.5);
  --faint:rgba(240,234,214,.3); --amber:#e9b872; --jade:#4ade9e; --coral:#f2616b;
  --line:rgba(240,234,214,.09);
  --display:"Schibsted Grotesk",system-ui,sans-serif; --mono:"JetBrains Mono",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{
  background:
    radial-gradient(1000px 680px at 50% -12%, rgba(233,184,114,.11), transparent 62%),
    radial-gradient(800px 560px at 50% 116%, rgba(74,222,158,.045), transparent 60%),
    var(--void);
  color:var(--corona); font-family:var(--display);
  min-height:100vh; display:flex; flex-direction:column; overflow-x:hidden;
}
nav{display:flex;align-items:center;justify-content:space-between;padding:24px 28px;max-width:1100px;margin:0 auto;width:100%}
.brand{display:flex;align-items:center;gap:11px}
.brand .name{font-weight:700;font-size:17px;letter-spacing:.18em}
nav a{color:var(--muted);text-decoration:none;font-family:var(--mono);font-size:12px;letter-spacing:.06em;transition:color .15s}
nav a:hover{color:var(--corona)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 24px 64px}
.eclipse{position:relative;width:200px;height:200px;margin-bottom:44px}
.ring{position:absolute;inset:0;border-radius:50%;border:1px solid var(--line)}
.ring.r2{inset:22px;border-color:rgba(240,234,214,.055)}
.corona{position:absolute;inset:30px;border-radius:50%;
  background:radial-gradient(circle at 38% 62%, #fbf4df 0%, #e9b872 44%, #9a7b3e 74%, transparent 100%);
  animation:breathe 6s ease-in-out infinite}
.shadow{position:absolute;width:152px;height:152px;border-radius:50%;background:var(--void);
  top:16px;right:12px;box-shadow:inset 0 0 50px rgba(0,0,0,.55)}
.orbit{position:absolute;inset:0;animation:spin 24s linear infinite}
.orbit .dot{position:absolute;top:2px;left:50%;width:5px;height:5px;border-radius:50%;background:var(--amber);box-shadow:0 0 12px var(--amber)}
@keyframes breathe{0%,100%{opacity:.92;transform:scale(1)}50%{opacity:1;transform:scale(1.02)}}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:clamp(44px,7vw,82px);font-weight:700;letter-spacing:-.03em;line-height:.98;margin-bottom:20px}
h1 .glow{color:var(--amber)}
.sub{font-size:clamp(15px,2vw,18px);color:var(--muted);max-width:430px;line-height:1.55;margin-bottom:30px}
.sub b{color:var(--corona);font-weight:600}
.chips{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--faint);margin-bottom:40px;flex-wrap:wrap;justify-content:center}
.chips i{font-style:normal;color:var(--muted)}
.chips .sep{width:3px;height:3px;border-radius:50%;background:var(--faint)}

/* ---- waitlist form ---- */
.join{display:flex;gap:10px;width:100%;max-width:430px;margin-bottom:14px}
.join input{flex:1;background:rgba(240,234,214,.04);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;color:var(--corona);font-family:var(--mono);font-size:14px;outline:none;transition:border-color .15s}
.join input::placeholder{color:var(--faint)}
.join input:focus{border-color:rgba(233,184,114,.5)}
.join button{background:var(--amber);color:#1a1206;border:none;border-radius:12px;padding:0 22px;
  font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.02em;cursor:pointer;
  transition:filter .15s,transform .1s;white-space:nowrap}
.join button:hover{filter:brightness(1.06)}
.join button:active{transform:translateY(1px)}
.join button:disabled{opacity:.55;cursor:default}
.note{font-family:var(--mono);font-size:12px;letter-spacing:.04em;min-height:18px;color:var(--muted);transition:color .2s}
.note.ok{color:var(--jade)} .note.err{color:var(--coral)}
@media(max-width:480px){.join{flex-direction:column}}

footer{display:flex;justify-content:space-between;padding:20px 28px;max-width:1100px;margin:0 auto;width:100%;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--faint);flex-wrap:wrap;gap:8px}
@media(max-width:560px){nav a{font-size:11px} .eclipse{width:170px;height:170px} .shadow{width:130px;height:130px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<nav>
  <div class="brand">
    <svg width="28" height="28" viewBox="0 0 40 40" fill="none">
      <circle cx="20" cy="20" r="13.5" fill="none" stroke="#e9b872" stroke-width="0.6" opacity="0.55"/>
      <circle cx="20" cy="20" r="12" fill="#e9b872"/>
      <circle cx="24.4" cy="15.6" r="12" fill="#08090c"/>
    </svg>
    <span class="name">SHADE</span>
  </div>
  <a href="https://x.com/tradedotshade" target="_blank" rel="noopener">X &#8599;</a>
</nav>
<main>
  <div class="eclipse">
    <div class="ring"></div><div class="ring r2"></div>
    <div class="corona"></div>
    <div class="shadow"></div>
    <div class="orbit"><span class="dot"></span></div>
  </div>
  <h1>Trade in the<br><span class="glow">shade.</span></h1>
  <p class="sub">The open dark pool for Solana. Your orders stay <b>hidden until they fill.</b></p>
  <div class="chips">
    <i>Hidden orders</i><span class="sep"></span>
    <i>Real-time matching</i><span class="sep"></span>
    <i>Settled on Solana</i>
  </div>

  <form class="join" id="join" novalidate>
    <input id="contact" type="text" inputmode="email" autocomplete="email"
           placeholder="your email or @handle" aria-label="email or X handle" maxlength="120" />
    <button type="submit" id="go">Join waitlist</button>
  </form>
  <p class="note" id="note" role="status" aria-live="polite"></p>
</main>
<footer>
  <span>SHADE &middot; open dark pool</span>
  <span>matched on MagicBlock &middot; settled on Solana</span>
</footer>

<script>
  // Backend (Render). The form and the count both call this.
  const API = "https://shade-h73q.onrender.com";

  const form  = document.getElementById('join');
  const input = document.getElementById('contact');
  const go    = document.getElementById('go');
  const note  = document.getElementById('note');

  // social proof: how many already joined
  fetch(API + '/api/waitlist/count')
    .then(r => r.json())
    .then(d => { if (d && d.ok && d.total > 0) note.textContent = d.total.toLocaleString() + ' already in the shade'; })
    .catch(() => {});

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const contact = input.value.trim();
    note.className = 'note';
    if (!contact) { note.textContent = 'enter your email or @handle'; note.classList.add('err'); return; }

    go.disabled = true; const label = go.textContent; go.textContent = 'joining…';
    try {
      const r = await fetch(API + '/api/waitlist', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contact })
      });
      const d = await r.json();
      if (!r.ok || !d.ok) throw new Error(d.error || 'failed');

      form.style.display = 'none';
      note.className = 'note ok';
      note.textContent = d.already
        ? "you're already on the list 🌒"
        : "you're in the shade 🌒 — we'll be in touch.";
    } catch (err) {
      go.disabled = false; go.textContent = label;
      note.className = 'note err';
      note.textContent = (err && err.message) ? err.message : 'something went wrong — try again.';
    }
  });
</script>
</body>
</html>
